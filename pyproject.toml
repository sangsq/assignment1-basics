[project]
name = "cs336_basics"
version = "0.1.0"
description = "A byte-level BPE tokenizer and decoder-only Transformer LM written from primitives"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "einops>=0.8.1",     # readable tensor reshapes in the model
    "numpy",             # memmapped token arrays, batch sampling
    "regex>=2024.11.6",  # pre-tokenisation pattern; the stdlib re cannot express it
    "torch~=2.6.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torch~=2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'", # Intel Macs
    "tqdm>=4.67.1",      # BPE merge progress
    "matplotlib>=3.10.8",# scripts/plot_loss.py
    "setuptools",        # triton imports it at runtime; without it torch.compile fails
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.16",        # pinned so lint results do not drift with new releases
    "tiktoken>=0.9.0",   # tokenizer tests cross-check against it
    "jaxtyping>=0.3.0",  # shape annotations in tests/adapters.py
    "psutil>=6.1.1",     # memory-limit tests
]

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cs336_basics"
module-root = ""

[tool.uv]
package = true
python-preference = "managed"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "WARNING"
addopts = "-s"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Pinned explicitly so the rule set does not drift with the ruff version.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "SIM", "RUF", "PERF", "FURB"]
ignore = [
    "F722",     # jaxtyping shape annotations look like forward-ref syntax errors
    "RUF007",   # zip(x, x[1:]) is clearer than pairwise() for byte-pair scans
]

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "E501"]
# tests/ is course-provided starter code; lint it but do not restyle it.
"tests/**" = ["F403", "F405", "SIM115", "PERF402", "SIM118", "PLR0402", "W605", "UP015", "I001", "B905"]
