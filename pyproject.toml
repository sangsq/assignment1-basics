[project]
name = "cs336_basics"
version = "1.0.6"
description = "A byte-level BPE tokenizer and decoder-only Transformer LM written from primitives"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "einops>=0.8.1", # tensor operations
    "einx>=0.3.0", # more general tensor operations
    "jaxtyping>=0.3.0", # type hints for pytorch/jax/numpy
    "numpy",
    "psutil>=6.1.1",
    "pytest>=8.3.4",
    "regex>=2024.11.6", # more powerful regex than the builtin `re` module
    "submitit>=1.5.2", # job submission for SLURM
    "tiktoken>=0.9.0",
    "torch~=2.6.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torch~=2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'", # Intel Macs
    "tqdm>=4.67.1",
    "wandb>=0.19.7",
    "ty>=0.0.1a16",
    "matplotlib>=3.10.8",
    "tokenizers>=0.23.1",
    "pyarrow>=25.0.0",
    "huggingface-hub>=1.24.0",
]

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cs336_basics"
module-root = ""

[tool.uv]
package = true
python-preference = "managed"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "WARNING"
addopts = "-s"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Pinned explicitly so the rule set does not drift with the ruff version.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "SIM", "RUF", "PERF", "FURB"]
ignore = [
    "F722",     # jaxtyping shape annotations look like forward-ref syntax errors
    "RUF007",   # zip(x, x[1:]) is clearer than pairwise() for byte-pair scans
]

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "E501"]
# tests/ is course-provided starter code; lint it but do not restyle it.
"tests/**" = ["F403", "F405", "SIM115", "PERF402", "SIM118", "PLR0402", "W605", "UP015", "I001", "B905"]
